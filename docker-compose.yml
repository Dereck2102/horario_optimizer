version: '3.8'

services:
  horarios:
    build: .
    container_name: horarios-uce
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data  # Persistencia de BD SQLite y archivos
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
